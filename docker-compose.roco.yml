# =============================================================================
# Docker Compose - back-roco apenas
# DB Backup Manager (Rust / Loco)
# =============================================================================
#
# Sobe APENAS o back-roco, sem o backend AdonisJS. Usa o build multi-stage
# do back-roco/Dockerfile, que ja' embute o frontend Vue compilado.
#
# Uso:
#   docker compose -f docker-compose.roco.yml up --build
#
# A porta externa padrao e' 3355; sobrescreva via variavel ROCO_EXTERNAL_PORT.
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: back-roco/Dockerfile
      target: runtime
    restart: unless-stopped
    # O socket do Docker é montado como root:root 660 no host; sem acesso ao
    # grupo root o usuário não-privilegiado `roco` não consegue falar com a
    # Engine (bollard/Docker::connect_with_local_defaults falha).
    group_add:
      - '0'
    env_file:
      - path: ./.env
        required: false
    ports:
      - '${ROCO_EXTERNAL_PORT:-3355}:3333'
    environment:
      LOCO_ENV: development
      BINDING: 0.0.0.0
      PORT: 3333
      TZ: ${TZ:-America/Sao_Paulo}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      AUTH_ACCESS_TOKEN_EXPIRES_IN: ${AUTH_ACCESS_TOKEN_EXPIRES_IN:-7d}
      INITIAL_ADMIN_BOOTSTRAP_TOKEN: ${INITIAL_ADMIN_BOOTSTRAP_TOKEN:-}
      DATABASE_URL: sqlite:///storage/database/back-roco.sqlite?mode=rwc
      BACKUP_STORAGE_PATH: /storage/backups
      DIAGNOSTICS_PATH: /storage/diagnostics
      # ID deste container, para exclui-lo das metricas do Docker Manager.
      BACKEND_CONTAINER_ID: ${BACKEND_CONTAINER_ID:-}
    volumes:
      - ./back-roco/storage/backups:/storage/backups
      - ./back-roco/storage/database:/storage/database
      - ./back-roco/storage/diagnostics:/storage/diagnostics
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:rw
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:3333/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
