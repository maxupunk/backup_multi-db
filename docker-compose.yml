# =============================================================================
# Docker Compose - Producao
# DB Backup Manager (backend / Rust / Loco)
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    # O socket do Docker é montado como root:root 660 no host; sem acesso ao
    # grupo root o usuário não-privilegiado `roco` não consegue falar com a
    # Engine (bollard/Docker::connect_with_local_defaults falha).
    group_add:
      - '0'
    env_file:
      - path: ./.env
        required: false
    expose:
      - '3333'
    networks:
      - system-network
    environment:
      LOCO_ENV: production
      LOCO_CONFIG_FOLDER: /app/config
      BINDING: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Sao_Paulo}
      BACKUP_STORAGE_PATH: /storage/backups
      # O Loco usa `database.url` no YAML; em producao apontamos para o volume.
      # `mode=rwc` e obrigatorio: sem ele o sqlx abre com `create_if_missing`
      # desligado e o primeiro boot em um volume vazio morre com
      # `SqliteError { code: 14, "unable to open database file" }`.
      DATABASE_URL: sqlite:///storage/database/app.sqlite3?mode=rwc
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800}
      INITIAL_ADMIN_BOOTSTRAP_TOKEN: ${INITIAL_ADMIN_BOOTSTRAP_TOKEN:-}
      BACKUP_DELETE_LOCAL_AFTER_REMOTE_UPLOAD: ${BACKUP_DELETE_LOCAL_AFTER_REMOTE_UPLOAD:-false}
      DIAGNOSTICS_PATH: /storage/diagnostics
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      # ID deste container, para exclui-lo das metricas do Docker Manager.
      BACKEND_CONTAINER_ID: ${BACKEND_CONTAINER_ID:-}
    volumes:
      - backup_data:/storage/backups
      - database_data:/storage/database
      - diagnostics_data:/storage/diagnostics
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:rw
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:3333/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          # Alinhado ao RSS ocioso real medido em repouso.
          memory: 128M

networks:
  system-network:
    external: true

volumes:
  backup_data:
  database_data:
  diagnostics_data:
