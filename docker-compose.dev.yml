# =============================================================================
# Docker Compose - Desenvolvimento
# DB Backup Manager (backend / Rust / Loco)
# =============================================================================
#
# Sobe o backend em modo desenvolvimento. O frontend em modo dev
# deve ser executado localmente com `cd frontend && pnpm dev`.
#
# Para forçar rebuild:
#   docker compose -f docker-compose.dev.yml down -v
#   docker compose -f docker-compose.dev.yml up --build
#
# Para usar a porta externa definida em .env:
#   docker compose -f docker-compose.dev.yml up
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    # O socket do Docker é montado com o GID do host (geralmente grupo `docker`, ex: 999 ou 998).
    # Sem pertencer a esse grupo, o usuário não-privilegiado `roco` recebe EACCES (Permission Denied).
    group_add:
      - '0'
      - '${DOCKER_GID:-999}'
    env_file:
      - path: ./.env
        required: false
    ports:
      - '${ROCO_EXTERNAL_PORT:-3355}:3333'
    environment:
      LOCO_ENV: development
      LOCO_CONFIG_FOLDER: /app/config
      BINDING: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      TZ: ${TZ:-America/Sao_Paulo}
      BACKUP_STORAGE_PATH: /storage/backups
      DATABASE_URL: sqlite:///storage/database/backend.sqlite?mode=rwc
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800}
      INITIAL_ADMIN_BOOTSTRAP_TOKEN: ${INITIAL_ADMIN_BOOTSTRAP_TOKEN:-}
      BACKUP_DELETE_LOCAL_AFTER_REMOTE_UPLOAD: ${BACKUP_DELETE_LOCAL_AFTER_REMOTE_UPLOAD:-false}
      DIAGNOSTICS_PATH: /storage/diagnostics
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      BACKEND_CONTAINER_ID: ${BACKEND_CONTAINER_ID:-}
    volumes:
      - ./backend/storage/backups:/storage/backups
      - ./backend/storage/database:/storage/database
      - ./backend/storage/diagnostics:/storage/diagnostics
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:rw
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://localhost:3333/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  system-network:
    external: true
