[workspace]

[package]
name = "back_roco"
version = "0.1.0"
edition = "2021"
# `CARGO_PKG_RUST_VERSION` alimenta o `nodeVersion` de `GET /api/system/status`.
rust-version = "1.85"
publish = false
default-run = "back_roco-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.0" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  # Fase 7: o pipeline de dump/restore da' `spawn` em `mysqldump`/`pg_dump` e
  # transmite o stdout deles para o disco sem passar pela memoria.
  "process",
  "fs",
  "io-util",
  "time",
  "sync",
] }
async-trait = { version = "0.1" }
# `multipart` cobre `POST /api/backups/import`, o unico endpoint da API que
# recebe arquivo. O extractor do Axum entrega o campo em pedacos, o que permite
# gravar 500 MB em disco sem bufferizar o upload inteiro.
axum = { version = "0.8", features = ["multipart"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
aes-gcm = "0.11"
aes = "0.9"
typenum = "1"
base64 = "0.23"
hex = "0.4"
getrandom = "0.3"
thiserror = "2"
subtle = "2"
scrypt = { version = "0.12", default-features = false }
sha2 = "0.11"
crc32fast = "1"
sysinfo = "0.39.6"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "postgres", "macros"] }
# Gzip em streaming (Fase 7). O Loco nao expoe compressao de arquivo, e a
# alternativa — `flate2` num `spawn_blocking` — exigiria bombear os pedacos a
# mao entre o mundo async e o sincrono. `async-compression` e' um `AsyncWrite`
# que entra direto no `tokio::io::copy`, mantendo o backpressure de ponta a
# ponta: quando o disco fica para tras, o stdout do dump e' pausado em vez de
# a fila crescer sem teto.
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip"] }
# `ReaderStream` converte o arquivo aberto no corpo de `GET /:id/download` sem
# ler o backup inteiro para a memoria.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

[[bin]]
name = "back_roco-cli"
path = "src/bin/main.rs"
required-features = []
[[bin]]
name = "migrate_data"
path = "src/bin/migrate_data.rs"
required-features = []
[[bin]]
name = "schema_diff"
path = "src/bin/schema_diff.rs"
required-features = []
[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
axum-test = "17"
# Diretorio descartavel por teste do pipeline de dump/import — sem ele os
# testes escreveriam no `backup_storage_path` real da maquina.
tempfile = "3"
