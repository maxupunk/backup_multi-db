# Suite de contrato contra o backend (Rust/Loco).
#
# Roda a cada PR pelo motivo mais importante e menos obvio: os golden files sao
# a especificacao do backend. Se o backend mudar uma resposta e ninguem
# regravar o golden, a suite passa a testar um contrato que nao existe mais.
# Este job e' o que garante que os golden files nao apodrecam sem aviso.

name: contract-tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'contract-tests/**'
      - 'docs/routes-baseline.txt'
      - '.github/workflows/contract-tests.yml'
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            contract-tests/pnpm-lock.yaml

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Instalar dependencias da suite
        working-directory: contract-tests
        run: pnpm install --frozen-lockfile

      # Os matchers primeiro: se o instrumento de medida esta' quebrado, o
      # resultado da suite nao significa nada e falhar aqui economiza tempo.
      - name: Testes do harness
        working-directory: contract-tests
        run: pnpm contract:selftest

      - name: Suite de contrato contra o backend
        working-directory: contract-tests
        run: pnpm contract:roco

      # Golden regravado e nao commitado e' a falha silenciosa que este job
      # existe para pegar. `--record` reescreve os arquivos; se o diff nao for
      # vazio, o contrato mudou e o PR precisa assumir a mudanca.
      - name: Detectar golden desatualizado
        working-directory: contract-tests
        run: |
          pnpm contract:record
          if ! git diff --quiet -- __golden__; then
            echo "::error::Os golden files estao desatualizados. Rode \`pnpm contract:record\` e commite o resultado."
            git --no-pager diff -- __golden__
            exit 1
          fi

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-reports
          path: |
            contract-tests/reports/
            contract-tests/.contract/*/server.log
          if-no-files-found: ignore
