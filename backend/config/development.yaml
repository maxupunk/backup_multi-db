# Loco configuration file documentation

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1)
  pretty_backtrace: true
  # Log level, options: trace, debug, info, warn or error.
  level: debug
  # Define the logging format. options: compact, pretty or json
  format: compact
  # By default the logger has filtering only logs that came from your code or logs that came from `loco` framework. to see all third party libraries
  # Uncomment the line below to override to see all third party libraries you can enable this config and override the logger filters.
  # override_filter: trace

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  port: {{ get_env(name="PORT", default="5150") }}
  # Binding for the server (which interface to bind to)
  binding: {{ get_env(name="BINDING", default="localhost") }}
  # The UI hostname or IP address that mailers will point to.
  host: http://localhost
  # Middlewares que o proprio Loco traz. O que nao esta' aqui esta' desligado.
  middlewares:
    # A SPA e' servida por um `ServeDir` em `after_routes`, e `/api` tem o
    # proprio catch-all: a pagina de fallback do Loco nunca deveria aparecer.
    fallback:
      enable: false
    # Um panico num handler vira 500 em JSON em vez de derrubar a conexao sem
    # resposta nenhuma.
    catch_panic:
      enable: true
    # Correlaciona as linhas de log de uma mesma requisicao. Sem ele, dois
    # backups simultaneos produzem um log intercalado e ilegivel.
    request_id:
      enable: true
    # Teto de corpo. O upload de backup tem o proprio limite, em
    # `backup_import::MAX_UPLOAD_BYTES`; este cobre todas as outras rotas, para
    # que um corpo gigante nao seja lido inteiro na memoria antes de ser
    # recusado.
    limit_payload:
      enable: true
      body_limit: 512mb
    # Uma requisicao presa (um dump contra um host que engole pacotes) libera o
    # worker em vez de segurar a conexao ate' o cliente desistir.
    timeout_request:
      enable: false
    secure_headers:
      enable: true
      preset: github

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: BackgroundAsync

# Jobs nativos do Loco. A tarefa de backup lê as conexões a cada execução, por
# isso um CRUD de agendamento entra em vigor sem reiniciar o processo.
scheduler:
  output: stdout
  jobs:
    scheduled_backups:
      run: scheduled_backups
      schedule: "0 0 * * * * *"
      tags: ["backups"]
    audit_retention:
      run: audit_retention
      schedule: "0 0 2 * * * *"
      tags: ["maintenance"]

  

# Mailer Configuration.
mailer:
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: true
    # SMTP server host. e.x localhost, smtp.gmail.com
    host: localhost
    # SMTP server port
    port: 1025
    # Use secure connection (SSL/TLS).
    secure: false
    # auth:
    #   user:
    #   password:
    # Override the SMTP hello name (default is the machine's hostname)
    # hello_name:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI
  uri: {{ get_env(name="DATABASE_URL", default="sqlite://backend_development.sqlite?mode=rwc") }}
  # When enabled, the sql query will be logged.
  enable_logging: false
  # Set the timeout duration when acquiring a connection.
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  # Set the idle duration before closing a connection.
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  # Minimum number of connections for a pool.
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  # Maximum number of connections for a pool.
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="1") }}
  # Run migration up when application loaded
  auto_migrate: true
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Authentication Configuration
# Autenticacao. O token de sessao e' um JWT assinado com este segredo.
auth:
  jwt:
    # Nunca versionado: o valor real vem do ambiente. O default abaixo so'
    # serve para desenvolvimento e e' publico por definicao — em producao
    # `JWT_SECRET` e' obrigatorio, e um segredo vazado permite forjar sessao de
    # qualquer usuario.
    #
    # Precisa ser base64 valido **com padding**: o Loco chama
    # `EncodingKey::from_base64_secret`, que recusa `=` faltando com
    # "Invalid padding" — e a falha so' aparece na primeira tentativa de assinar
    # um token, como um 500 no `login`.
    secret: {{ get_env(name="JWT_SECRET", default="ZGV2LW9ubHktand0LXNlY3JldA==") }}
    # Vida do token, em segundos. Como o JWT nao pode ser revogado, este e' o
    # unico limite sobre quanto tempo um token vazado continua servindo.
    expiration: {{ get_env(name="JWT_EXPIRATION", default="604800") }} # 7 dias

# Configuracao especifica da aplicacao (tarefa 3.1 do roadmap).
#
# Validada no boot pelo `SettingsInitializer`: uma chave ausente ou malformada
# derruba o processo na hora, e nao na primeira requisicao que tentar
# descriptografar uma senha.
settings:
  # Chave AES-256-GCM em hex (64 caracteres). Deve ser IDENTICA a
  # `DB_ENCRYPTION_KEY` do Adonis — e' com ela que os ciphertexts ja' gravados
  # continuam legiveis apos o cutover (decisao D3).
  db_encryption_key: "{{ get_env(name="DB_ENCRYPTION_KEY", default="000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f") }}"
  # Token exigido para criar o primeiro administrador.
  initial_admin_bootstrap_token: "{{ get_env(name="INITIAL_ADMIN_BOOTSTRAP_TOKEN", default="") }}"
  backup_storage_path: "{{ get_env(name="BACKUP_STORAGE_PATH", default="/storage/backups") }}"
  diagnostics_path: "{{ get_env(name="DIAGNOSTICS_PATH", default="/storage/diagnostics") }}"
  # 0 desliga a poda de logs de auditoria.
  audit_retention_days: {{ get_env(name="AUDIT_RETENTION_DAYS", default="30") }}
  # Os quatro limitadores do `app/middleware/rate_limit_middleware.ts`.
  # `duration` em segundos.
  rate_limits:
    global: { requests: 600, duration: 60 }
    auth: { requests: 20, duration: 60 }
    strict: { requests: 60, duration: 60 }
    backup: { requests: 60, duration: 60 }
